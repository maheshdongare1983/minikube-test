apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-bg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-bg
  template:
    metadata:
      labels:
        app: guestbook-bg
    spec:
      containers:
      - image: docker.io/argoproj/nginx:latest
        name: guestbook-bg
        ports:
        - containerPort: 80
